# Private demo: every route needs a login; API calls are rate-limited per IP.

limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # --- access control -------------------------------------------------------
    auth_basic           "Patent search (private demo)";
    auth_basic_user_file /etc/nginx/htpasswd;
    # Optional IP allowlist on top of the password (uncomment and fill in):
    # allow 203.0.113.10;
    # deny  all;

    # --- headers --------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
    }

    # Presentation page (planned): mount a folder and uncomment.
    # location /present/ { alias /srv/present/; }
}
