# Raya: docker compose -f deploy/docker-compose.yml up -d --build
# Needs (not committed): deploy/index/qwen3/ (from export_index.py) and deploy/htpasswd.
name: patent-search

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: patent-search:latest
    restart: unless-stopped
    environment:
      INDEX_DIR: /index/qwen3
      ENABLE_RERANK: "0"          # "1" allows ?rerank=true (MiniLM, ~3 s/query on 4 vCPU)
      # EMBED_DTYPE: float32      # set if bf16 is slow on Raya's CPU (measure first)
    volumes:
      - ./index:/index:ro
      - hf-cache:/hf
    expose:
      - "8000"                    # only reachable through nginx
    deploy:
      resources:
        limits:
          cpus: "3.0"             # leave a core for nginx + the host
          memory: 6g

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # If Raya already runs a host nginx/Caddy with TLS, change to "127.0.0.1:8080:80"
      # and proxy to it; otherwise this is the public entry point.
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro

volumes:
  hf-cache:
